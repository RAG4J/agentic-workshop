<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en-GB">
<head th:replace="~{fragments/template :: head('Token Page')}"><title>is replaced</title></head>
<body class="bg-light">
<header th:replace="~{fragments/template :: header}"></header>
<main>
    <!-- Header include -->
<div class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">Token</h1>
            <p>You can obtain a token here for the OpenAI service. You still need to add it to the application.properties file and restart the application</p>
            <form th:action="@{/token}" method="post" class="d-flex flex-column gap-2">
                <div class="mb-3">
                    <label for="userId" class="form-label">User ID for token:</label>
                    <input type="text" id="userId" name="userId" class="form-control" placeholder="Enter your user ID" th:value="${userId}" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send</button>
            </form>
            <div th:if="${confirmation}" class="alert alert-success confirmation mt-3">
                <p th:text="${confirmation}" class="mb-0"></p>
            </div>
            <pre>
                <code th:text="${obtainedToken}"></code>
            </pre>
            <div th:if="${error}" class="alert alert-danger error mt-3">
                <p th:text="${error}" class="mb-0"></p>
            </div>
        </div>
    </div>
</div>
</main>
<footer th:replace="~{fragments/template :: footer}"></footer>
<script th:replace="~{fragments/template :: script}"></script>
</body>
</html>
